backend:
  name: github
  repo: JeandersonSB/estrada-a-dois-blog
  branch: main
  base_url: https://estrada-a-dois-blog.vercel.app/api
  commit_messages:
    create: 'content(cms): criar {{collection}} "{{slug}}" [skip vercel]'
    update: 'content(cms): atualizar {{collection}} "{{slug}}" [skip vercel]'
    delete: 'content(cms): excluir {{collection}} "{{slug}}" [skip vercel]'
    uploadMedia: 'content(cms): enviar mídia "{{path}}" [skip vercel]'
    deleteMedia: 'content(cms): excluir mídia "{{path}}" [skip vercel]'

# Habilita testes no seu próprio computador
local_backend: true

media_folder: "public/images/blog"
public_folder: "/images/blog"

# Normaliza imagens no próprio navegador antes do upload.
# Isso corrige fotos HEIC/HEIF (inclusive quando chegam com extensão .jpg)
# e padroniza JPEG/PNG/AVIF/WebP em WebP real, evitando incompatibilidade
# entre o conteúdo do arquivo e sua extensão.
media_libraries:
  all:
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 88
        width: 2048
        height: 2048

# Configuração da identidade da interface
site_url: "https://www.estradaadois.com"
display_url: "https://www.estradaadois.com"
logo_url: "https://www.estradaadois.com/images/logo-admin.png"
# Configuração de URLs e Slugs limpos (SEO-friendly sem acentos)
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "posts"
    label: "Artigos do Blog"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    summary: "{{status}} {{title}}"
    sortable_fields: ["date", "title", "category", "status"]
    view_filters:
      - label: "Apenas Rascunhos"
        field: status
        pattern: "Rascunho"
      - label: "Apenas Publicados"
        field: status
        pattern: "Publicado"
    view_groups:
      - label: "Status (Rascunho / Publicado)"
        field: status
      - label: "Categoria"
        field: category
    fields:
      - { label: "Título do Artigo", name: "title", widget: "string" }
      - { label: "Status de Publicação", name: "status", widget: "select", options: ["⏳ Rascunho", "🟢 Publicado"], default: "⏳ Rascunho" }
      - { label: "Data e Hora de Publicação", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ss", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "Categoria", name: "category", widget: "select", options: ["Roteiros", "Dicas", "Manutenção", "Equipamentos", "Notícias"] }
      - { label: "Imagem de Capa (Horizontal)", name: "image", widget: "image" }
      - { label: "Resumo para a Home (Até 3 linhas)", name: "excerpt", widget: "text" }
      - { label: "Conteúdo do Artigo", name: "body", widget: "markdown" }
