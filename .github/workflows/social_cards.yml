name: Gerador de Cards para Redes Sociais (Instagram & TikTok)

permissions:
  contents: write

concurrency:
  group: social-cards
  cancel-in-progress: false


on:
  push:
    branches:
      - main
    paths:
      - 'content/posts/**'
      - '.github/workflows/social_cards.yml'
      - 'scripts/social_*.mjs'

  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug do artigo específico (deixe vazio para rodar automáticos)'
        required: false
        default: ''
        type: string
      sample:
        description: 'Número de artigos de amostra por categoria (ex: 2)'
        required: false
        default: ''
        type: string
      force:
        description: 'Forçar reenvio mesmo que já tenha sido divulgado'
        required: false
        default: false
        type: boolean

jobs:
  gerar-cards-sociais:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip vercel]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar Dependências
        run: npm ci --no-audit --no-fund

      - name: Gerar Cards e Enviar no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_SLUG: ${{ github.event.inputs.slug }}
          INPUT_SAMPLE: ${{ github.event.inputs.sample }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          if [ -n "$INPUT_SAMPLE" ]; then
            ARGS="--sample=$INPUT_SAMPLE"
          fi
          if [ -n "$INPUT_SLUG" ]; then
            ARGS="$ARGS --slug=$INPUT_SLUG"
          fi
          if [ "$INPUT_FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          node scripts/social_bot.mjs $ARGS

      - name: Atualizar Histórico no Repositório
        run: bash scripts/git_commit_retry.sh "chore: atualizar historico de cards sociais divulgados [skip vercel]" .social_history.json
