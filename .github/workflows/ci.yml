name: CI - Qualidade do Site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências de forma reproduzível
        run: npm ci --no-audit --no-fund

      - name: Validar scripts de automação
        run: |
          node --check scripts/normalize_published_images.mjs
          bash -n scripts/git_commit_retry.sh

      - name: Testar normalização de imagem na publicação
        run: |
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          git config user.name "ci-test"
          git config user.email "ci-test@example.com"

          mkdir -p content/posts public/images/blog

          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp({
            create: {
              width: 800,
              height: 600,
              channels: 3,
              background: { r: 30, g: 30, b: 30 }
            }
          }).jpeg({ quality: 85 }).toFile('public/images/blog/IMG_1234.JPG');
          NODE

          cat > content/posts/artigo-teste.md <<'EOF'
          ---
          title: "Artigo Teste"
          status: "⏳ Rascunho"
          image: "/images/blog/IMG_1234.JPG"
          ---

          Conteúdo de teste.
          EOF

          git add content/posts/artigo-teste.md public/images/blog/IMG_1234.JPG
          git commit --quiet -m "fixture: rascunho"
          BEFORE_SHA="$(git rev-parse HEAD)"

          sed -i 's/⏳ Rascunho/🟢 Publicado/' content/posts/artigo-teste.md
          git add content/posts/artigo-teste.md
          git commit --quiet -m "fixture: publicar"
          HEAD_SHA="$(git rev-parse HEAD)"

          node scripts/normalize_published_images.mjs "$BEFORE_SHA" "$HEAD_SHA"

          test -f public/images/blog/artigo-teste.jpg
          test ! -f public/images/blog/IMG_1234.JPG
          grep -F 'image: "/images/blog/artigo-teste.jpg"' content/posts/artigo-teste.md

          git reset --hard "$ORIGINAL_SHA"
          git clean -fd content/posts public/images/blog

      - name: Testar capa já normalizada sem barra duplicada
        run: |
          ORIGINAL_SHA="$(git rev-parse HEAD)"
          git config user.name "ci-test"
          git config user.email "ci-test@example.com"

          mkdir -p content/posts public/images/blog

          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          await sharp({
            create: {
              width: 800,
              height: 600,
              channels: 3,
              background: { r: 60, g: 60, b: 60 }
            }
          }).webp({ quality: 82 }).toFile('public/images/blog/artigo-normalizado.webp');
          NODE

          cat > content/posts/artigo-normalizado.md <<'EOF'
          ---
          title: "Artigo Normalizado"
          status: "🟢 Publicado"
          image: "/images/blog/artigo-normalizado.webp"
          ---

          Conteúdo inicial.
          EOF

          git add content/posts/artigo-normalizado.md public/images/blog/artigo-normalizado.webp
          git commit --quiet -m "fixture: artigo publicado"
          BEFORE_SHA="$(git rev-parse HEAD)"

          printf '\nAtualização editorial.\n' >> content/posts/artigo-normalizado.md
          git add content/posts/artigo-normalizado.md
          git commit --quiet -m "fixture: editar artigo"
          HEAD_SHA="$(git rev-parse HEAD)"

          node scripts/normalize_published_images.mjs "$BEFORE_SHA" "$HEAD_SHA"

          grep -F 'image: "/images/blog/artigo-normalizado.webp"' content/posts/artigo-normalizado.md
          if grep -Fq 'image: "//images/blog/' content/posts/artigo-normalizado.md; then
            echo "ERRO: referência de imagem ganhou barra duplicada"
            exit 1
          fi

          git reset --hard "$ORIGINAL_SHA"
          git clean -fd content/posts public/images/blog

      - name: Validar conversão de AVIF para WebP
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';

          const source = '/tmp/fixture-avif.avif';
          const output = '/tmp/fixture-avif.webp';

          await sharp({
            create: {
              width: 960,
              height: 720,
              channels: 3,
              background: { r: 235, g: 235, b: 235 }
            }
          }).avif({ quality: 70 }).toFile(source);

          const inputMeta = await sharp(source).metadata();
          if (inputMeta.format !== 'heif' && inputMeta.format !== 'avif') {
            throw new Error(`Fixture AVIF inválida: ${inputMeta.format}`);
          }

          await sharp(source)
            .rotate()
            .webp({ quality: 82, effort: 4 })
            .toFile(output);

          const outputMeta = await sharp(output).metadata();
          if (outputMeta.format !== 'webp' || !outputMeta.width || !outputMeta.height) {
            throw new Error('Falha ao converter AVIF para WebP');
          }

          console.log(`Conversão AVIF -> WebP validada: ${outputMeta.width}x${outputMeta.height}`);
          NODE

      - name: Testar renderização de tabelas Markdown
        run: |
          node --input-type=module <<'NODE'
          import { remark } from 'remark';
          import remarkGfm from 'remark-gfm';
          import html from 'remark-html';

          const markdown = `| Categoria | Valor |
          | --- | --- |
          | Combustível | R$ 240,76 |
          | **Total** | **R$ 240,76** |`;

          const output = String(
            await remark()
              .use(remarkGfm)
              .use(html)
              .process(markdown)
          );

          if (!output.includes('<table>') || !output.includes('<th>Categoria</th>') || !output.includes('<td>Combustível</td>')) {
            console.error(output);
            throw new Error('Tabela Markdown não foi renderizada como HTML');
          }

          console.log('Tabela GFM renderizada corretamente.');
          NODE

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Relatório completo de dependências
        continue-on-error: true
        run: npm audit --audit-level=low
