name: Faxina Vercel (Limpeza de Deploys Antigos)

on:
  schedule:
    # Manutenção semanal: domingo às 05:47 no horário de Brasília (08:47 UTC).
    # Com o fim das publicações automáticas, não há mais necessidade de rodar a cada 6 horas.
    - cron: '47 8 * * 0'
  workflow_dispatch:
    # Permite disparar manualmente a qualquer momento pela aba Actions do GitHub

jobs:
  faxina:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Executar Faxina de Deploys Antigos
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: 'prj_VAkuyXkjskhBGAEkT7R5LyglgJAp'
          VERCEL_TEAM_ID: 'team_aJBVPVcwGqAPDRsLQYhOBYRf'
          KEEP_PREVIEW: '2'
          MAX_DEPLOYMENTS: '500'
        run: node scripts/clean_vercel.mjs
