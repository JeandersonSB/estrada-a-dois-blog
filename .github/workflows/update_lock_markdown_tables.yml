name: Atualizar lockfile - Markdown Tables

on:
  push:
    branches:
      - fix/markdown-tables
    paths:
      - '.github/workflows/update_lock_markdown_tables.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/markdown-tables
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Atualizar package-lock
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Salvar lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore(deps): atualizar lockfile do remark-gfm [skip vercel]"
          git push origin HEAD:fix/markdown-tables
