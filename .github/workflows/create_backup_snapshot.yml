name: Criar Backup Snapshot 2026-09-23

on:
  push:
    branches:
      - backup/snapshot-2026-09-23
    paths:
      - '.github/workflows/create_backup_snapshot.yml'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do snapshot
        uses: actions/checkout@v7
        with:
          ref: backup/snapshot-2026-09-23
          fetch-depth: 1

      - name: Registrar metadados do backup
        run: |
          cat > BACKUP_INFO.txt <<'EOF'
          Estrada a Dois - Backup de código e conteúdo
          Data do snapshot: 2026-09-23
          Branch de origem: main
          Commit da versão congelada: d79f5d25aed810f8e63ba69e1649884e53560aaf

          Este backup contém o código-fonte, artigos, imagens públicas, configurações
          e workflows versionados no GitHub.

          Não contém segredos da Vercel, GitHub Actions ou outras credenciais,
          pois esses dados não ficam armazenados no repositório.
          EOF

      - name: Empacotar snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Estrada-a-Dois_Backup_2026-09-23_d79f5d25
          path: |
            .
            !.git/**
            !.github/workflows/create_backup_snapshot.yml
          include-hidden-files: true
          compression-level: 6
          retention-days: 30
