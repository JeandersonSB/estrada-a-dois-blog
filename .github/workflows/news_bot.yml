name: Robô Jornalista (Auto-Post)

on:
  schedule:
    # Horários de Brasília: 05:47, 09:47, 11:47, 14:47, 17:47, 19:47 (UTC +3h)
    # Cada horário em linha independente garante registro e disparo autônomo no scheduler do GitHub
    - cron: '47 8 * * *'   # 05:47 BRT
    - cron: '47 12 * * *'  # 09:47 BRT
    - cron: '47 14 * * *'  # 11:47 BRT
    - cron: '47 17 * * *'  # 14:47 BRT
    - cron: '47 20 * * *'  # 17:47 BRT
    - cron: '47 22 * * *'  # 19:47 BRT

  workflow_dispatch:
    # Permite disparar manualmente escolhendo a quantidade de notícias
    inputs:
      count:
        description: 'Quantidade de notícias a gerar'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'

  push:
    branches:
      - main
    paths:
      - '.github/workflows/news_bot.yml'
      - 'scripts/news_bot.mjs'

jobs:
  gerar-noticia:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Instalar Dependências
        run: npm install
        
      - name: Rodar a Inteligência Artificial
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWS_COUNT: ${{ github.event.inputs.count || '' }}
        run: node scripts/news_bot.mjs 2>&1 | tee bot_debug.log
        
      - name: Salvar e Publicar no Painel (Rascunho)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Notícia Automática (Rascunho gerado pela IA)"
          branch: main
          file_pattern: 'content/posts/*.md public/images/blog/* bot_debug.log'

