name: Otimizar Imagens do Blog

permissions:
  contents: write

concurrency:
  group: estrada-main-write
  cancel-in-progress: false
  queue: max

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/images/**'

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar Dependências
        run: npm ci --no-audit --no-fund

      - name: Executar Otimização de Imagens
        run: node scripts/optimize_images.mjs

      - name: Salvar Imagens Otimizadas no Repositório
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "perf(images): otimização inteligente de imagens do blog [skip vercel]"
          branch: main
          file_pattern: 'public/images/**'
