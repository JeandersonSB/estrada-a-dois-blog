name: Otimizar Imagens do Blog

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false


on:
  workflow_dispatch:
  push:
    paths:
      - 'public/images/**'

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar Dependências
        run: npm ci --no-audit --no-fund

      - name: Executar Otimização de Imagens
        run: node scripts/optimize_images.mjs

      - name: Salvar Imagens Otimizadas no Repositório
        run: bash scripts/git_commit_retry.sh "perf(images): otimização inteligente de imagens do blog [skip vercel]" public/images
