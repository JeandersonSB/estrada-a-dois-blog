name: Limpeza Editorial AdSense (one-shot)

on:
  push:
    branches:
      - chore/adsense-readiness-2026-09-22
    paths:
      - 'scripts/adsense_content_cleanup.mjs'
      - '.github/workflows/adsense_content_cleanup.yml'

permissions:
  contents: write

concurrency:
  group: adsense-content-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout da branch
        uses: actions/checkout@v7
        with:
          ref: chore/adsense-readiness-2026-09-22
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Consolidar conteúdo e localizar capas
        run: node scripts/adsense_content_cleanup.mjs

      - name: Remover automação temporária
        run: git rm scripts/adsense_content_cleanup.mjs .github/workflows/adsense_content_cleanup.yml

      - name: Salvar limpeza na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(content): consolidar notícias, links e capas locais [skip vercel]"
          git push origin HEAD:chore/adsense-readiness-2026-09-22
