name: Robô Especialista (Dicas, Equipamentos e Manutenção)

on:
  schedule:
    # Horário de Brasília: 10:47 (13:47 UTC)
    # Dias da semana: Segunda (1), Quarta (3) e Sexta (5)
    # Minuto 47 evita congestionamento de servidores no GitHub Actions
    - cron: '47 13 * * 1,3,5'

  workflow_dispatch:
    inputs:
      category:
        description: 'Escolha a categoria (ou deixe auto para rodízio automático)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'Dicas'
          - 'Equipamentos'
          - 'Manutenção'
          - 'Todas'

jobs:
  gerar-artigo-especialista:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências Mínimas
        run: npm install @google/generative-ai

      - name: Redigir Artigo Especialista com IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CATEGORY: ${{ github.event.inputs.category || 'auto' }}
        run: node scripts/expert_bot.mjs

      - name: Salvar Rascunho no Repositório (Git Auto-Commit)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Novo Artigo Especialista (Rascunho gerado pela IA)"
          branch: main
          file_pattern: 'content/posts/*.md'
