name: Publicar Artigos Aprovados — Segunda, Quarta e Sexta

on:
  schedule:
    # 10h47 em Brasília. Recupera também aprovações de datas anteriores.
    - cron: '47 13 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-content
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Liberar somente artigos aprovados e vencidos
        id: publish
        continue-on-error: true
        run: node scripts/publish_editorial.mjs
      - name: Salvar publicação e solicitar deploy
        id: save
        if: always() && steps.publish.outcome != 'skipped'
        run: |
          bash scripts/git_commit_retry.sh \
            "content(editorial): publicar artigos aprovados [force vercel] [publish-finalized]" \
            content/posts .publish-trigger
      - name: Confirmar envio para publicação no Telegram
        if: always() && steps.save.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/publish_editorial.mjs notify
      - name: Sinalizar artigos bloqueados
        if: always() && steps.publish.outcome == 'failure'
        run: exit 1
