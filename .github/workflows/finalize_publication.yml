name: Finalizar Publicação (Imagem + Deploy)

on:
  push:
    branches:
      - main
    paths:
      - 'content/posts/**'
      - 'public/images/blog/**'

permissions:
  contents: write

concurrency:
  group: finalize-publication
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[publish-finalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout da main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Instalar dependências para validação de imagens
        run: npm ci --no-audit --no-fund

      - name: Verificar publicação e normalizar imagem
        id: normalize
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          node scripts/normalize_published_images.mjs "$BEFORE_SHA" "$HEAD_SHA"
          code=$?
          set -e

          if [ "$code" -eq 10 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Criar commit final e liberar deploy
        if: steps.normalize.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > .publish-trigger
          bash scripts/git_commit_retry.sh \
            "chore(content): finalizar publicação e imagem [force vercel] [publish-finalized]" \
            content/posts public/images/blog .publish-trigger
